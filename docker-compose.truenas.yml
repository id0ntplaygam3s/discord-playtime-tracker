services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./config/.env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_NAMESPACE:-id0ntplaygam3s}/discord-playtime-tracker-backend:${APP_IMAGE_TAG:-latest}
    env_file:
      - ./config/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-id0ntplaygam3s}/discord-playtime-tracker-frontend:${APP_IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-4091}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
