services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_NAMESPACE:-id0ntplaygam3s}/discord-playtime-tracker-backend:${APP_IMAGE_TAG:-latest}
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      STEAM_API_KEY: ${STEAM_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app
      TIMEZONE: ${TIMEZONE}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-0}
      RETENTION_CHECK_INTERVAL_MINUTES: ${RETENTION_CHECK_INTERVAL_MINUTES}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_VERSION: ${APP_VERSION}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-id0ntplaygam3s}/discord-playtime-tracker-frontend:${APP_IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
